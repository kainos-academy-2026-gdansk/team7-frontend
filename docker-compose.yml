services:
  frontend:
    build: .
    image: team7-frontend
    container_name: team7-frontend
    restart: unless-stopped
    # Set literally, not via ${...}: compose auto-loads .env, whose localhost values
    # are for `npm run dev` and are unreachable from inside the container.
    environment:
      PORT: 4000
      API_BASE_URL: http://backend:3000
    ports:
      - "4000:4000"
    networks:
      - kainos-work-network

networks:
  kainos-work-network:
    external: true
