name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 20 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run ci:check
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start E2E backend environment
        env:
          BACKEND_E2E_IMAGE: ${{ vars.BACKEND_E2E_IMAGE }}
          E2E_JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
        run: docker compose -f docker-compose.e2e.yml up -d --wait
      - run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        env:
          API_BASE_URL: http://127.0.0.1:3000
          SESSION_SECRET: ${{ secrets.E2E_FRONTEND_SESSION_SECRET }}
          BASE_URL: http://127.0.0.1:4001
          E2E_PORT: "4001"
          E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_JOB_ROLE_ID: ${{ vars.E2E_JOB_ROLE_ID }}
        run: npm run test:e2e
      - name: Show E2E container logs on failure
        if: failure()
        env:
          BACKEND_E2E_IMAGE: ${{ vars.BACKEND_E2E_IMAGE }}
          E2E_JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
        run: docker compose -f docker-compose.e2e.yml logs --no-color
      - name: Remove E2E backend environment
        if: always()
        env:
          BACKEND_E2E_IMAGE: ${{ vars.BACKEND_E2E_IMAGE }}
          E2E_JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
        run: docker compose -f docker-compose.e2e.yml down -v
  build:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: team7-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm team7-frontend:${{ github.sha }} node --version
